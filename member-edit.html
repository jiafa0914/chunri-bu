<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成员资料 · 椿日部</title>
<link rel="icon" href="assets/svg/seal.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header-placeholder"></div>

<section class="section">
  <div class="container" style="max-width:760px">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>我的资料<span class="dot"></span></h2>
      <p class="section-sub">设置你的照片、签名与背景音乐</p>
    </div>

    <div class="admin-card hidden" id="me-error" style="text-align:center"></div>

    <div class="grid me-grid" style="grid-template-columns:1fr 280px;gap:26px;align-items:start">
      <div>
        <div class="admin-card hidden" id="me-form">
          <h3 id="me-name-show">—</h3>

          <div class="admin-card" style="box-shadow:none;background:var(--paper-2)">
            <h3>编辑密钥（由社主提供，仅存本浏览器）</h3>
            <div class="field"><label>GitHub Owner</label><input id="me-conn-owner"></div>
            <div class="field"><label>仓库名</label><input id="me-conn-repo"></div>
            <div class="field"><label>Token</label><input id="me-conn-token" type="password" placeholder="github_pat_xxx..."></div>
          </div>

          <h3 style="margin:18px 0 12px">照片</h3>
          <div class="field">
            <div class="mini-upload">
              <input id="me-photo-url" placeholder="照片链接，或直接上传" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,252,243,.8)">
              <input id="me-photo-file" type="file" accept="image/*">
            </div>
          </div>

          <h3 style="margin:18px 0 12px">签名</h3>
          <div class="field"><input id="me-signature" placeholder="一蓑烟雨任平生"></div>

          <h3 style="margin:18px 0 12px">背景音乐</h3>
          <div class="field">
            <div class="mini-upload">
              <input id="me-bgm-url" placeholder="音乐链接，或直接上传 mp3（8MB 内）" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,252,243,.8)">
              <input id="me-bgm-file" type="file" accept="audio/*">
            </div>
            <div class="hint">保存后，成员列表里你的卡片会出现「♪ 听曲」按钮。</div>
          </div>

          <div class="form-actions">
            <button class="btn btn-cinnabar" id="me-save">保存我的资料</button>
          </div>
        </div>
      </div>
      <div>
        <div class="admin-card">
          <h3 style="text-align:center">预览</h3>
          <div class="hidden" id="me-preview"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer-placeholder"></div>
<script src="assets/js/github.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/member-edit.js"></script>
</body>
</html>
