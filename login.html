<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 椿日部</title>
<link rel="icon" href="assets/svg/seal.svg">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<div id="site-header-placeholder"></div>

<div class="container" style="max-width:520px;padding-top:36px;padding-bottom:60px">
  <div class="admin-card">
    <h3 id="login-title">登录椿日部</h3>
    <p class="hint" style="margin-bottom:14px">登录后可设置自己的照片、签名和背景音乐，也能给相册投稿。</p>

    <div class="tabs" id="auth-tabs" style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn btn-cinnabar btn-sm" id="tab-login">登录</button>
      <button class="btn btn-paper btn-sm" id="tab-reg">注册</button>
    </div>

    <!-- 登录 -->
    <div id="form-login">
      <div class="field"><label>邮箱</label><input id="lg-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>密码</label><input id="lg-pwd" type="password" placeholder="请输入密码"></div>
      <div class="form-actions">
        <button class="btn btn-cinnabar btn-sm" id="lg-submit">登 录</button>
      </div>
      <p class="hint" style="margin-top:10px">没有账号？点上方「注册」，用邮箱+验证码 30 秒注册。</p>
      <p class="hint" style="margin-top:6px"><a href="#" id="fg-link" style="color:var(--cinnabar)">忘记密码？</a></p>
    </div>

    <!-- 注册 -->
    <div id="form-reg" style="display:none">
      <div class="field">
        <label>邮箱（用于登录，也会收到验证码）</label>
        <input id="rg-email" type="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>验证码</label>
        <div style="display:flex;gap:8px">
          <input id="rg-code" placeholder="6 位验证码" style="flex:1">
          <button class="btn btn-paper btn-sm" id="rg-send" style="white-space:nowrap">发送验证码</button>
        </div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label>确认密码</label><input id="rg-pwd2" type="password" placeholder="再输一次"></div>
        <div class="field"><label>设置密码</label><input id="rg-pwd" type="password" placeholder="8~32 位，需含字母和数字"></div>
      </div>
      <div class="field"><label>游戏昵称 / 游戏ID（选填，用于自动绑定档案）</label><input id="rg-name" placeholder="例如：川厌"></div>
      <div class="form-actions">
        <button class="btn btn-cinnabar btn-sm" id="rg-submit">注 册</button>
      </div>
      <p class="hint" style="margin-top:10px">注册即代表你是椿日部成员；第一位注册的成员会被设为「社主」管理员。</p>
    </div>

    <!-- 忘记密码 -->
    <div id="form-forgot" style="display:none">
      <div class="field"><label>邮箱（注册时用的）</label><input id="fg-email" type="email" placeholder="you@example.com"></div>
      <div class="field">
        <label>验证码</label>
        <div style="display:flex;gap:8px">
          <input id="fg-code" placeholder="6 位验证码" style="flex:1">
          <button class="btn btn-paper btn-sm" id="fg-send" style="white-space:nowrap">发送验证码</button>
        </div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label>新密码</label><input id="fg-pwd" type="password" placeholder="8~32 位，含字母和数字"></div>
        <div class="field"><label>确认新密码</label><input id="fg-pwd2" type="password" placeholder="再输一次"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-cinnabar btn-sm" id="fg-submit">重置密码</button>
        <button class="btn btn-paper btn-sm" id="fg-back">返回登录</button>
      </div>
      <p class="hint" style="margin-top:10px">验证码会发到你的邮箱（含垃圾箱）。</p>
    </div>

    <div id="auth-done" style="display:none">
      <p style="margin:8px 0">✅ 已登录：<b id="done-email"></b></p>
      <div class="form-actions">
        <a class="btn btn-cinnabar btn-sm" href="my.html">进入我的档案</a>
        <a class="btn btn-paper btn-sm" href="index.html">返回首页</a>
      </div>
    </div>
  </div>
</div>

<div id="site-footer-placeholder"></div>
<script src="assets/js/vendor/cloudbase.full.js"></script>
<script src="assets/js/cloudbase.js"></script>
<script src="assets/js/github.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  var C = window.C, CB = window.CB;
  var verificationId = null;

  function $(id){ return document.getElementById(id); }

  function errText(e){
    if(!e) return '未知错误';
    if(typeof e === 'string') return e;
    var keys = ['message','errMsg','msg','error_description','errorMessage','reason','detail','error','err_msg'];
    for(var i = 0; i < keys.length; i++){
      var v = e[keys[i]];
      if(v && typeof v === 'string' && v !== '[object Object]') return v;
    }
    if(e.code && e.message) return e.code + ': ' + e.message;
    try {
      var s = JSON.stringify(e);
      if(s && s !== '{}' && s.length < 160) return s;
    } catch(_){}
    return '未知错误（请重试）';
  }

  function showLogin(){ $('form-login').style.display=''; $('form-reg').style.display='none'; $('login-title').textContent='登录椿日部'; }
  function showReg(){ $('form-login').style.display='none'; $('form-reg').style.display=''; $('login-title').textContent='注册椿日部'; }

  $('tab-login').addEventListener('click', function(){
    $('tab-login').className='btn btn-cinnabar btn-sm'; $('tab-reg').className='btn btn-paper btn-sm';
    showLogin();
  });
  $('tab-reg').addEventListener('click', function(){
    $('tab-reg').className='btn btn-cinnabar btn-sm'; $('tab-login').className='btn btn-paper btn-sm';
    showReg();
  });

  $('lg-submit').addEventListener('click', async function(){
    var email = $('lg-email').value.trim(), pwd = $('lg-pwd').value;
    if(!email || !pwd){ C.toast('请填写邮箱和密码', 'err'); return; }
    C.toast('登录中…');
    try {
      await CB.signIn(email, pwd);
      C.toast('登录成功', 'ok');
      showDone();
    } catch(e){ C.toast('登录失败：' + errText(e), 'err'); }
  });

  $('rg-send').addEventListener('click', async function(){
    var email = $('rg-email').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ C.toast('请先填写正确的邮箱', 'err'); return; }
    C.toast('正在发送验证码…');
    try {
      var v = await CB.sendEmailCode(email);
      verificationId = v && v.verification_id;
      C.toast('验证码已发送，请查收邮箱（含垃圾箱）', 'ok');
    } catch(e){ C.toast('发送失败：' + errText(e), 'err'); }
  });

  $('rg-submit').addEventListener('click', async function(){
    var email = $('rg-email').value.trim();
    var code = $('rg-code').value.trim();
    var pwd = $('rg-pwd').value;
    if(!email || !code || !pwd){ C.toast('请填写完整信息', 'err'); return; }
    if(pwd.length < 8 || pwd.length > 32){ C.toast('密码需 8~32 位', 'err'); return; } if(!/[a-zA-Z]/.test(pwd) || !/[0-9]/.test(pwd)){ C.toast('密码需同时包含字母和数字', 'err'); return; } if(pwd !== $('rg-pwd2').value){ C.toast('两次密码不一致', 'err'); return; }
    C.toast('注册中…');
    try {
      if(!verificationId) throw new Error('请先获取验证码');
      var vr = await CB.verifyCode(verificationId, code);
      var token = vr && vr.verification_token;
      if(!token) throw new Error('验证码校验失败，请重试');
      await CB.signUp({
        email: email,
        password: pwd,
        verification_code: code,
        verification_token: token
      });
      var boundName = '';
      var rgName = $('rg-name').value.trim();
      if(rgName){
        try {
          var plist = await CB.listProfiles();
          var pk = rgName.toLowerCase();
          var pt = (plist || []).filter(function(p){ if(p.uid || p.email) return false; var nn = String(p.name||'').toLowerCase(); var gg = String(p.gameId||'').toLowerCase(); return nn === pk || gg === pk; })[0];
          if(pt){
            await CB.coll('profiles').doc(pt._id || pt.id).update({ uid: CB.getUid(), email: CB.getEmail() || '', claimedAt: new Date().toISOString(), claimCode: '' });
            boundName = pt.name || rgName;
          }
        } catch(e){ console.warn('注册后自动绑定失败', e); }
      }
      C.toast(boundName ? ('注册成功，已自动绑定「' + boundName + '」') : '注册成功，已自动登录', 'ok');
      showDone(boundName);
    } catch(e){ C.toast('注册失败：' + errText(e), 'err'); }
  });

  function showDone(boundName){
    $('form-login').style.display='none';
    $('form-reg').style.display='none';
    $('auth-tabs').style.display='none';
    $('login-title').textContent='欢迎加入椿日部';
    $('done-email').textContent = (CB.getEmail() || '已登录') + (boundName ? '（已绑定档案：' + boundName + '）' : '');
    $('auth-done').style.display='';
  }

  /* ---------- 忘记密码 ---------- */
  var fgVerificationId = null;
  function fgMsg(e){
    if(!e) return '未知错误';
    if(typeof e === 'string') return e;
    if(e.message) return e.message;
    if(e.error_description) return e.error_description;
    if(e.error) return String(e.error);
    try { var s = JSON.stringify(e); if(s && s.length < 140) return s; } catch(_){}
    return '操作失败，请重试';
  }
  function showForgot(){
    $('form-login').style.display='none';
    $('form-reg').style.display='none';
    $('form-forgot').style.display='';
    $('auth-tabs').style.display='none';
    $('login-title').textContent='重置密码';
  }
  function showLoginForm(){
    $('form-login').style.display='';
    $('form-reg').style.display='none';
    $('form-forgot').style.display='none';
    $('auth-tabs').style.display='flex';
    $('login-title').textContent='登录椿日部';
  }
  $('fg-link').addEventListener('click', function(e){ e.preventDefault(); showForgot(); });
  $('fg-back').addEventListener('click', function(){ showLoginForm(); });
  $('fg-send').addEventListener('click', async function(){
    var email = $('fg-email').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ C.toast('请先填写正确的邮箱', 'err'); return; }
    C.toast('正在发送验证码…');
    try {
      var v = await CB.sendEmailCode(email);
      fgVerificationId = v && v.verification_id;
      C.toast('验证码已发送，请查收邮箱（含垃圾箱）', 'ok');
    } catch(e){ C.toast('发送失败：' + fgMsg(e), 'err'); }
  });
  $('fg-submit').addEventListener('click', async function(){
    var email = $('fg-email').value.trim();
    var code = $('fg-code').value.trim();
    var pwd = $('fg-pwd').value;
    if(!email || !code || !pwd){ C.toast('请填写完整信息', 'err'); return; }
    if(pwd.length < 8 || pwd.length > 32){ C.toast('密码需 8~32 位', 'err'); return; }
    if(!/[a-zA-Z]/.test(pwd) || !/[0-9]/.test(pwd)){ C.toast('密码需同时包含字母和数字', 'err'); return; }
    if(pwd !== $('fg-pwd2').value){ C.toast('两次密码不一致', 'err'); return; }
    C.toast('正在重置…');
    try {
      if(!fgVerificationId) throw new Error('请先获取验证码');
      var vr = await CB.verifyCode(fgVerificationId, code);
      var token = vr && vr.verification_token;
      if(!token) throw new Error('验证码校验失败，请重试');
      await CB.resetPassword(email, pwd, token);
      C.toast('密码已重置，请用新密码登录', 'ok');
      showLoginForm();
    } catch(e){ C.toast('重置失败：' + fgMsg(e), 'err'); }
  });

  (async function(){
    C.injectShell();
    var ls = await CB.getLoginState();
    var email = CB.getEmail() || '';
    if(ls && ls.user && email){ showDone(); }
  })().catch(function(e){ console.warn(e); });
})();
</script>
</body>
</html>
