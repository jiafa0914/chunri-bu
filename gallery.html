<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册 · 椿日部</title>
<link rel="icon" href="assets/svg/seal.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header-placeholder"></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>江湖相册<span class="dot"></span></h2>
      <p class="section-sub">记下椿日部的每一次相聚 · 点开相册可全屏浏览</p>
    </div>
    <div class="grid grid-3" id="album-list"></div>
  </div>
</section>

<div id="site-footer-placeholder"></div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="LB.close()">✕</button>
  <button class="lb-nav lb-prev" onclick="LB.prev()">‹</button>
  <img id="lb-img" alt="">
  <div class="lb-caption" id="lb-caption"></div>
  <div class="lb-index" id="lb-index"></div>
  <button class="lb-nav lb-next" onclick="LB.next()">›</button>
</div>

<script src="assets/js/github.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  var LB = window.LB = {
    albums: [], curAlbum: null, curIdx: 0,
    open: function(album, idx){
      LB.curAlbum = album; LB.curIdx = idx;
      document.getElementById('lightbox').classList.add('show');
      LB.render();
    },
    render: function(){
      var imgs = LB.curAlbum.images || [];
      var item = imgs[LB.curIdx];
      if(!item) return;
      document.getElementById('lb-img').src = item.src;
      document.getElementById('lb-caption').textContent = (LB.curAlbum.title || '') + (item.caption ? ' · ' + item.caption : '');
      document.getElementById('lb-index').textContent = (LB.curIdx + 1) + ' / ' + imgs.length;
    },
    close: function(){ document.getElementById('lightbox').classList.remove('show'); },
    prev: function(){ var n = (LB.curAlbum.images||[]).length; if(n) LB.curIdx = (LB.curIdx - 1 + n) % n; LB.render(); },
    next: function(){ var n = (LB.curAlbum.images||[]).length; if(n) LB.curIdx = (LB.curIdx + 1) % n; LB.render(); }
  };
  document.addEventListener('keydown', function(e){
    if(!document.getElementById('lightbox').classList.contains('show')) return;
    if(e.key === 'Escape') LB.close();
    if(e.key === 'ArrowLeft') LB.prev();
    if(e.key === 'ArrowRight') LB.next();
  });

  function albumCard(a){
    var cover = (a.cover && a.images && a.images.length) ? a.cover : ((a.images && a.images[0]) ? a.images[0].src : '');
    var coverHtml = cover
      ? '<img src="' + C.esc(cover) + '" alt="">'
      : '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:34px;color:var(--ink-3)">' + C.esc((a.title || '相册').slice(0,1)) + '</div>';
    return '<article class="card album-card" data-id="' + C.esc(a.id) + '">' +
      '<div class="album-cover">' + coverHtml + '</div>' +
      '<div class="card-title">' + C.esc(a.title || '未命名相册') + '</div>' +
      '<p class="card-text">' + C.esc(a.desc || '') + '</p>' +
      '<div class="album-count">共 ' + ((a.images || []).length) + ' 张</div>' +
      '</article>';
  }

  (async function(){
    var data = await C.fetchJSON('albums.json');
    LB.albums = data.albums || [];
    var box = document.getElementById('album-list');
    box.innerHTML = LB.albums.map(albumCard).join('') || '<p class="hint">相册还在建设中，敬请期待</p>';
    box.querySelectorAll('.album-card').forEach(function(card){
      card.addEventListener('click', function(){
        var a = LB.albums.find(function(x){ return x.id === card.dataset.id; });
        if(a && a.images && a.images.length) LB.open(a, 0);
      });
    });
  })().catch(function(e){ console.error(e); });
})();
</script>
</body>
</html>
