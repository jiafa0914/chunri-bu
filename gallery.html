<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册 · 椿日部</title>
<link rel="icon" href="assets/svg/seal.svg">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<div id="site-header-placeholder"></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>江湖相册<span class="dot"></span></h2>
      <p class="section-sub">记下椿日部的每一次相聚 · 点击相册标题即可展开照片</p>
    </div>
    <div id="album-list"></div>
  </div>
</section>

<div id="site-footer-placeholder"></div>

<div class="lightbox" id="lightbox" onclick="LB.close()">
  <button class="lb-close" onclick="event.stopPropagation();LB.close()">×</button>
  <img id="lb-img" alt="" onclick="event.stopPropagation()">
  <div class="lb-caption" id="lb-caption"></div>
</div>

<script src="assets/js/vendor/cloudbase.full.js"></script>
<script src="assets/js/cloudbase.js"></script>
<script src="assets/js/github.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  var LB = window.LB = {
    open: function(src, cap){
      document.getElementById('lb-img').src = src;
      document.getElementById('lb-caption').textContent = cap || '';
      document.getElementById('lightbox').classList.add('show');
    },
    close: function(){ document.getElementById('lightbox').classList.remove('show'); }
  };
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') LB.close(); });

  var albums = [];

  function albumCard(a, i){
    var imgs = a.images || [];
    var cover = a.cover || (imgs[0] ? imgs[0].src : '');
    var coverHtml = cover
      ? '<img src="' + C.esc(cover) + '" alt="" loading="lazy">'
      : '<div class="album-cover-ph">' + C.esc((a.title || '相册').slice(0,1)) + '</div>';
    return '<div class="list-item album-item" id="album-' + i + '">' +
      '<div class="list-item-head" onclick="window.__toggleAlbum(' + i + ')">' +
      '<div class="album-head"><div class="album-cover-sm">' + coverHtml + '</div>' +
      '<div class="album-head-info"><div class="list-item-title">' + C.esc(a.title || '未命名相册') + '</div>' +
      '<div class="list-item-meta">' + C.esc(a.desc || '') + (a.desc ? ' · ' : '') + '共 ' + imgs.length + ' 张</div></div></div>' +
      '<span class="list-item-arrow">▾</span></div>' +
      '<div class="list-item-body"><div class="album-grid" id="album-grid-' + i + '"></div></div></div>';
  }

    // 展开后才渲染照片，且分批加载（每批 20 张），避免照片太多导致卡顿
  function renderPhotos(i){
    var a = albums[i];
    if(!a) return;
    var grid = document.getElementById('album-grid-' + i);
    if(!grid || grid.dataset.loaded === 'done') return;
    if(grid.dataset.loaded) return;
    grid.dataset.loaded = 'start';
    var all = a.images || [];
    if(!all.length){ grid.innerHTML = '<p class="hint">这个相册还没有照片</p>'; grid.dataset.loaded = 'done'; return; }
    var pageSize = 20;
    var loadedCount = 0;
    var sentinel = null;
    var io = null;

    function addBatch(){
      var next = all.slice(loadedCount, loadedCount + pageSize);
      var frag = document.createDocumentFragment();
      next.forEach(function(im){
        var cap = im.caption || '';
        var fig = document.createElement('figure');
        fig.className = 'album-photo';
        fig.dataset.src = im.src || '';
        fig.dataset.cap = cap;
        var img = document.createElement('img');
        img.src = im.src || '';
        img.alt = '';
        img.loading = 'lazy';
        fig.appendChild(img);
        if(cap){ var fc = document.createElement('figcaption'); fc.textContent = cap; fig.appendChild(fc); }
        fig.addEventListener('click', function(){ LB.open(fig.dataset.src, fig.dataset.cap); });
        frag.appendChild(fig);
      });
      grid.insertBefore(frag, sentinel);
      loadedCount += next.length;
      if(loadedCount >= all.length){
        grid.dataset.loaded = 'done';
        if(sentinel) sentinel.remove();
        if(io) io.disconnect();
      }
    }

    sentinel = document.createElement('div');
    sentinel.className = 'album-load-more';
    grid.appendChild(sentinel);
    io = new IntersectionObserver(function(entries){
      if(entries[0] && entries[0].isIntersecting) addBatch();
    }, { rootMargin: '400px' });
    io.observe(sentinel);
    addBatch();
  }
window.__toggleAlbum(' + i + ')">' +
      '<div class="album-head"><div class="album-cover-sm">' + coverHtml + '</div>' +
      '<div class="album-head-info"><div class="list-item-title">' + C.esc(a.title || '未命名相册') + '</div>' +
      '<div class="list-item-meta">' + C.esc(a.desc || '') + (a.desc ? ' · ' : '') + '共 ' + imgs.length + ' 张</div></div></div>' +
      '<span class="list-item-arrow">▾</span></div>' +
      '<div class="list-item-body"><div class="album-grid" id="album-grid-' + i + '"></div></div></div>';
  }

  // 展开时才渲染照片，避免一开始加载几十上百张图导致卡顿
  function renderPhotos(i){
    var a = albums[i];
    if(!a) return;
    var grid = document.getElementById('album-grid-' + i);
    if(!grid || grid.dataset.loaded) return;
    grid.dataset.loaded = '1';
    grid.innerHTML = (a.images || []).map(function(im){
      var cap = im.caption || '';
      return '<figure class="album-photo" data-src="' + C.esc(im.src || '') + '" data-cap="' + C.esc(cap) + '">' +
        '<img src="' + C.esc(im.src || '') + '" alt="" loading="lazy">' +
        (cap ? '<figcaption>' + C.esc(cap) + '</figcaption>' : '') +
        '</figure>';
    }).join('') || '<p class="hint">这个相册还没有照片</p>';
    grid.querySelectorAll('.album-photo').forEach(function(f){
      f.addEventListener('click', function(){ LB.open(f.dataset.src, f.dataset.cap); });
    });
  }

  window.__toggleAlbum = function(i){
    var item = document.getElementById('album-' + i);
    if(!item) return;
    var open = item.classList.toggle('open');
    if(open) renderPhotos(i);
  };

  (async function(){
    var box = document.getElementById('album-list');
    var usedCloud = false;
    try {
      await CB.ensureAnon();
      var docs = await CB.listAlbums();
      if(docs && docs.length){
        usedCloud = true;
        var need = [];
        docs.forEach(function(a){ (a.images || []).forEach(function(im){ if(im && im.src) need.push(im.src); }); if(a.cover) need.push(a.cover); });
        var urls = {};
        try { urls = await CB.fileUrls(need); } catch(e){ console.warn(e); }
        albums = docs.map(function(a){
          return {
            id: a._id || a.id,
            title: a.title || '未命名相册',
            desc: a.desc || '',
            cover: a.cover ? (urls[a.cover] || '') : '',
            images: (a.images || []).map(function(im){
              return { src: im.src ? (urls[im.src] || '') : '', caption: im.caption || '' };
            }).filter(function(im){ return im.src; })
          };
        });
      }
    } catch(e){ console.warn('云相册读取失败，使用旧数据：', e); }
    if(!usedCloud){
      var data = await C.fetchJSON('albums.json');
      albums = data.albums || [];
    }
    box.innerHTML = albums.map(albumCard).join('') || '<p class="hint">相册还在建设中，敬请期待</p>';
  })().catch(function(e){ console.error(e); });
})();
</script>
</body>
</html>
