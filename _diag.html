<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="font-family:sans-serif;padding:16px"><h3>云端诊断</h3><pre id="out">loading...</pre>
<script src="assets/js/vendor/cloudbase.full.js"></script>
<script src="assets/js/cloudbase.js"></script>
<script>
(async function(){
  var out=document.getElementById('out');var log=[];function add(s){log.push(s);out.textContent=log.join('\n');}
  function err(e){try{return JSON.stringify({code:e&&e.code,message:e&&e.message,name:e&&e.name,raw:String(e)});}catch(_){return String(e);}}
  add('1. script loaded: yes');
  try{
    var CB=window.CB;CB.init();add('2. cloudbase init: ok');
    var ls=await CB.getLoginState();add('3. loginState: '+(ls?'present':'null'));
    try{ await CB.ensureAnon(); add('4. ensureAnon: ok'); }catch(e){ add('4. ensureAnon FAIL: '+err(e)); }
    var u=CB.currentUser();add('5. user uid='+(u&&(u.uid||u.openid)||'EMPTY'));
    try{ var ps=await CB.listProfiles(); add('6. listProfiles: ok count='+ps.length); }
    catch(e){ add('6. listProfiles FAIL: '+err(e)); }
    add('DONE');
  }catch(e){ add('FATAL: '+err(e)); }
})();
</script></body></html>
