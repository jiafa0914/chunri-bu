<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><pre id="out">running...</pre>
<script src="assets/js/vendor/cloudbase.full.js"></script>
<script>
(async function(){
  var out = document.getElementById('out');
  var log = [];
  function add(s){ log.push(s); out.textContent = log.join('\n'); }
  function fmt(e){ try{return JSON.stringify({code:e&&e.code,message:e&&e.message,raw:String(e)});}catch(_){return String(e);} }
  try {
    var app = cloudbase.init({ env: 'chunri-bu-d7gvy3e6naad3ba52', region: 'ap-shanghai' });
    await app.auth().signInAnonymously();
    var db = app.database();
    var ps = await db.collection('profiles').limit(1).get();
    var fid = ps.data[0].photo;
    add('fid=' + fid.substring(0,50));
    var tries = [3600, 86400, 604800, 2592000];
    for(var i=0;i<tries.length;i++){
      try {
        var r = await app.storage.from().createSignedUrls([fid], tries[i]);
        var item = (r.data||[])[0] || {};
        add('maxAge=' + tries[i] + ' -> ' + (item.signedUrl ? 'OK 有链接' : '空') + '  err=' + JSON.stringify(item.error || r.error || null));
      } catch(e){ add('maxAge=' + tries[i] + ' -> FAIL: ' + fmt(e)); }
    }
  } catch(e){ add('FATAL: ' + fmt(e)); }
})();
</script></body></html>
