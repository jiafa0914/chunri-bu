name: Deploy to CloudBase
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install CloudBase CLI
        run: npm i -g @cloudbase/cli

      - name: Assemble site files
        run: |
          mkdir -p dist
          cp index.html about.html members.html activities.html guides.html daily.html gallery.html recruit.html my.html login.html member-edit.html admin.html qr.html 404.html config.json members.json activities.json guides.json daily.json albums.json .nojekyll dist/ || true
          cp -r assets dist/
          ls -la dist

      - name: Login CloudBase CLI
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy app to CloudBase (webapps)
        timeout-minutes: 25
        env:
          TCB_ENV_ID: chunri-bu-d7gvy3e6naad3ba52
        run: |
          # drop unused legacy BGM files to speed up upload
          rm -f dist/assets/music/sitebgm-20260806083248-g50o.mp3 \
                dist/assets/music/sitebgm-20260806083359-nwjv.mp3 \
                dist/assets/music/sitebgm-20260806091159-9nn5.mp3 \
                dist/assets/music/jiangshang-qingfengyou.ogg
          set +e
          last=1
          for i in 1 2 3; do
            echo "=== CloudBase deploy attempt $i ==="
            tcb app deploy chunri-bu \
              --framework static \
              --install-command "" \
              --build-command "" \
              --output-dir ./dist \
              --deploy-path /chunri-bu \
              --force \
              --yes \
              -e "$TCB_ENV_ID"
            last=$?
            if [ "$last" -eq 0 ]; then
              echo "deploy OK"
              exit 0
            fi
            echo "attempt $i failed (exit $last), retrying..."
            sleep 5
          done
          exit "$last"