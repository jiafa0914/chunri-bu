<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4f6"/>
      <stop offset="1" stop-color="#f4dfe5"/>
    </linearGradient>
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fce4e9"/>
      <stop offset="70%" stop-color="#f5c6cf"/>
      <stop offset="100%" stop-color="#ebaab5"/>
    </radialGradient>
    <filter id="blurSoft"><feGaussianBlur stdDeviation="42"/></filter>
    <g id="petalBig">
      <path d="M0 0 C -16 -22 -19 -42 -7 -57 C -2.5 -62 2.5 -62 7 -57 C 19 -42 16 -22 0 0 Z" fill="url(#petalGrad)"/>
      <path d="M0 -6 C -7 -16 -8 -27 -3 -38 C -1 -41 1 -41 3 -38 C 8 -27 7 -16 0 -6 Z" fill="#e18494" opacity="0.38"/>
    </g>
    <g id="bloomBig">
      <use href="#petalBig"/>
      <use href="#petalBig" transform="rotate(72)"/>
      <use href="#petalBig" transform="rotate(144)"/>
      <use href="#petalBig" transform="rotate(216)"/>
      <use href="#petalBig" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="9" fill="#f9e9ee"/>
      <g fill="#c94f63">
        <circle cx="0" cy="-5" r="2.2"/>
        <circle cx="4.8" cy="-1.6" r="2.2"/>
        <circle cx="2.9" cy="4" r="2.2"/>
        <circle cx="-2.9" cy="4" r="2.2"/>
        <circle cx="-4.8" cy="-1.6" r="2.2"/>
      </g>
      <g fill="#f6d3da">
        <circle cx="0" cy="-5" r="1.1"/>
        <circle cx="4.8" cy="-1.6" r="1.1"/>
        <circle cx="2.9" cy="4" r="1.1"/>
        <circle cx="-2.9" cy="4" r="1.1"/>
        <circle cx="-4.8" cy="-1.6" r="1.1"/>
      </g>
    </g>
    <g id="bud">
      <circle cx="0" cy="0" r="11" fill="#f2b8c4"/>
      <circle cx="-3" cy="-3" r="4.5" fill="#fce1e6"/>
    </g>
    <g id="petal-s"><path d="M0 0 C -6 -8 -7 -14 -2.6 -19 C -1 -21 1 -21 2.6 -19 C 7 -14 6 -8 0 0 Z" fill="#f0b4c2"/></g>
    <style>
      @keyframes bloomBig { 0% {opacity:0; transform:scale(.12) rotate(-14deg)} 55% {opacity:1; transform:scale(1.07) rotate(3deg)} 100% {opacity:1; transform:scale(1) rotate(0deg)} }
      .bloom{ animation: bloomBig 5.5s ease-out both; transform-box:fill-box; transform-origin:center; }
      @keyframes sway { 0%,100% {transform:rotate(-2.5deg)} 50% {transform:rotate(2.5deg)} }
      .sway{ animation: sway 9s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      .fade{ animation: fadeIn 6s ease-out both; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse class="fade" cx="800" cy="430" rx="440" ry="290" fill="#fdf1f4" opacity="0.8" filter="url(#blurSoft)"/>
  <g class="sway" style="animation-delay:6.5s"><g class="bloom" style="animation-delay:.3s"><use href="#bloomBig" transform="translate(130 120) scale(1.35)"/></g></g>
  <g class="sway" style="animation-delay:7s"><g class="bloom" style="animation-delay:1s"><use href="#bloomBig" transform="translate(1480 90) scale(1.45)"/></g></g>
  <g class="sway" style="animation-delay:6.8s"><g class="bloom" style="animation-delay:1.6s"><use href="#bloomBig" transform="translate(430 40) scale(.95)"/></g></g>
  <g class="sway" style="animation-delay:7.2s"><g class="bloom" style="animation-delay:2.2s"><use href="#bloomBig" transform="translate(1170 45) scale(1)"/></g></g>
  <g class="sway" style="animation-delay:7s"><g class="bloom" style="animation-delay:2.8s"><use href="#bloomBig" transform="translate(60 430) scale(1.25)"/></g></g>
  <g class="sway" style="animation-delay:7.5s"><g class="bloom" style="animation-delay:3.4s"><use href="#bloomBig" transform="translate(150 720) scale(1.05)"/></g></g>
  <g class="sway" style="animation-delay:7.3s"><g class="bloom" style="animation-delay:3.9s"><use href="#bloomBig" transform="translate(1540 420) scale(1.35)"/></g></g>
  <g class="sway" style="animation-delay:7.8s"><g class="bloom" style="animation-delay:4.4s"><use href="#bloomBig" transform="translate(1450 730) scale(.95)"/></g></g>
  <g class="sway" style="animation-delay:7.6s"><g class="bloom" style="animation-delay:4.9s"><use href="#bloomBig" transform="translate(280 885) scale(1.2)"/></g></g>
  <g class="sway" style="animation-delay:8s"><g class="bloom" style="animation-delay:5.4s"><use href="#bloomBig" transform="translate(1320 890) scale(1.25)"/></g></g>
  <g class="sway" style="animation-delay:8.2s"><g class="bloom" style="animation-delay:5.9s"><use href="#bloomBig" transform="translate(820 40) scale(.7)"/></g></g>
  <g class="sway" style="animation-delay:8.4s"><g class="bloom" style="animation-delay:6.4s"><use href="#bloomBig" transform="translate(650 130) scale(.55)"/></g></g>
  <g class="sway" style="animation-delay:8.6s"><g class="bloom" style="animation-delay:6.9s"><use href="#bloomBig" transform="translate(1010 120) scale(.6)"/></g></g>
  <g class="sway" style="animation-delay:8.8s"><g class="bloom" style="animation-delay:7.4s"><use href="#bloomBig" transform="translate(370 330) scale(.55)"/></g></g>
  <g class="sway" style="animation-delay:9s"><g class="bloom" style="animation-delay:7.9s"><use href="#bloomBig" transform="translate(1240 320) scale(.6)"/></g></g>
  <g class="sway" style="animation-delay:9.2s"><g class="bloom" style="animation-delay:8.4s"><use href="#bloomBig" transform="translate(700 840) scale(.8)"/></g></g>
  <g class="fade" style="animation-delay:4s">
    <use href="#bud" transform="translate(210 260)"/>
    <use href="#bud" transform="translate(320 80) scale(.8)"/>
    <use href="#bud" transform="translate(1400 210) scale(.9)"/>
    <use href="#bud" transform="translate(100 620) scale(.85)"/>
    <use href="#bud" transform="translate(1510 610) scale(.8)"/>
    <use href="#bud" transform="translate(520 850) scale(.9)"/>
    <use href="#bud" transform="translate(1060 860) scale(.85)"/>
    <use href="#bud" transform="translate(760 110) scale(.7)"/>
  </g>
  <g>
    <g><animateTransform attributeName="transform" type="translate" from="520 -80" to="520 1000" dur="10s" begin="2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="330" dur="7s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="780 -80" to="780 1020" dur="12s" begin="4s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-300" dur="8s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="950 -80" to="950 990" dur="11s" begin="1s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="360 -80" to="360 980" dur="13s" begin="3s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-340" dur="7.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1180 -80" to="1180 1000" dur="10.5s" begin="5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="320" dur="6.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="640 -80" to="640 980" dur="12.5s" begin="6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-320" dur="8.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1030 -80" to="1030 960" dur="11.5s" begin="2.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="340" dur="7s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1380 -80" to="1380 980" dur="13.5s" begin="4.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-310" dur="8s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
  </g>
</svg>
