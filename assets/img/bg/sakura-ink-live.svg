<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4f6"/>
      <stop offset="1" stop-color="#f4dfe5"/>
    </linearGradient>
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fce4e9"/>
      <stop offset="70%" stop-color="#f5c6cf"/>
      <stop offset="100%" stop-color="#ebaab5"/>
    </radialGradient>
    <filter id="blurSoft"><feGaussianBlur stdDeviation="42"/></filter>
    <g id="petalBig">
      <path d="M0 0 C -16 -22 -19 -42 -7 -57 C -2.5 -62 2.5 -62 7 -57 C 19 -42 16 -22 0 0 Z" fill="url(#petalGrad)"/>
      <path d="M0 -6 C -7 -16 -8 -27 -3 -38 C -1 -41 1 -41 3 -38 C 8 -27 7 -16 0 -6 Z" fill="#e18494" opacity="0.38"/>
    </g>
    <g id="bloomBig">
      <use href="#petalBig"/>
      <use href="#petalBig" transform="rotate(72)"/>
      <use href="#petalBig" transform="rotate(144)"/>
      <use href="#petalBig" transform="rotate(216)"/>
      <use href="#petalBig" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="9" fill="#f9e9ee"/>
      <g fill="#c94f63">
        <circle cx="0" cy="-5" r="2.2"/>
        <circle cx="4.8" cy="-1.6" r="2.2"/>
        <circle cx="2.9" cy="4" r="2.2"/>
        <circle cx="-2.9" cy="4" r="2.2"/>
        <circle cx="-4.8" cy="-1.6" r="2.2"/>
      </g>
      <g fill="#f6d3da">
        <circle cx="0" cy="-5" r="1.1"/>
        <circle cx="4.8" cy="-1.6" r="1.1"/>
        <circle cx="2.9" cy="4" r="1.1"/>
        <circle cx="-2.9" cy="4" r="1.1"/>
        <circle cx="-4.8" cy="-1.6" r="1.1"/>
      </g>
    </g>
    <g id="bud">
      <circle cx="0" cy="0" r="11" fill="#f2b8c4"/>
      <circle cx="-3" cy="-3" r="4.5" fill="#fce1e6"/>
    </g>
    <g id="petal-s"><path d="M0 0 C -6 -8 -7 -14 -2.6 -19 C -1 -21 1 -21 2.6 -19 C 7 -14 6 -8 0 0 Z" fill="#f0b4c2"/></g>
    <style>
      @keyframes bloomBig { 0% {opacity:0; transform:scale(.12) rotate(-14deg)} 55% {opacity:1; transform:scale(1.07) rotate(3deg)} 100% {opacity:1; transform:scale(1) rotate(0deg)} }
      .bloom{ animation: bloomBig 6s ease-out both; transform-box:fill-box; transform-origin:center; }
      @keyframes sway { 0%,100% {transform:rotate(-2.5deg)} 50% {transform:rotate(2.5deg)} }
      .sway{ animation: sway 10s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      .fade{ animation: fadeIn 6s ease-out both; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse class="fade" cx="800" cy="430" rx="460" ry="300" fill="#fdf1f4" opacity="0.82" filter="url(#blurSoft)"/>
  <g class="sway" style="animation-delay:7s"><g class="bloom" style="animation-delay:.3s"><use href="#bloomBig" transform="translate(90 140) scale(2.0)"/></g></g>
  <g class="sway" style="animation-delay:7.5s"><g class="bloom" style="animation-delay:1.2s"><use href="#bloomBig" transform="translate(1500 70) scale(2.1)"/></g></g>
  <g class="sway" style="animation-delay:8s"><g class="bloom" style="animation-delay:2s"><use href="#bloomBig" transform="translate(1350 770) scale(1.9)"/></g></g>
  <g class="sway" style="animation-delay:8.5s"><g class="bloom" style="animation-delay:2.8s"><use href="#bloomBig" transform="translate(250 800) scale(2.0)"/></g></g>
  <g class="sway" style="animation-delay:9s"><g class="bloom" style="animation-delay:3.5s"><use href="#bloomBig" transform="translate(40 470) scale(1.8)"/></g></g>
  <g class="sway" style="animation-delay:9.5s"><g class="bloom" style="animation-delay:4.2s"><use href="#bloomBig" transform="translate(1560 400) scale(1.7)"/></g></g>
  <g class="sway" style="animation-delay:10s"><g class="bloom" style="animation-delay:4.9s"><use href="#bloomBig" transform="translate(470 55) scale(1.4)"/></g></g>
  <g class="sway" style="animation-delay:10.5s"><g class="bloom" style="animation-delay:5.6s"><use href="#bloomBig" transform="translate(1120 95) scale(1.3)"/></g></g>
  <g class="sway" style="animation-delay:11s"><g class="bloom" style="animation-delay:6.3s"><use href="#bloomBig" transform="translate(820 30) scale(1.1)"/></g></g>
  <g class="sway" style="animation-delay:11.5s"><g class="bloom" style="animation-delay:7s"><use href="#bloomBig" transform="translate(360 320) scale(1.2)"/></g></g>
  <g class="sway" style="animation-delay:12s"><g class="bloom" style="animation-delay:7.7s"><use href="#bloomBig" transform="translate(1240 305) scale(1.15)"/></g></g>
  <g class="sway" style="animation-delay:12.5s"><g class="bloom" style="animation-delay:8.4s"><use href="#bloomBig" transform="translate(705 850) scale(1.3)"/></g></g>
  <g class="sway" style="animation-delay:13s"><g class="bloom" style="animation-delay:9.1s"><use href="#bloomBig" transform="translate(150 650) scale(1.2)"/></g></g>
  <g class="sway" style="animation-delay:13.5s"><g class="bloom" style="animation-delay:9.8s"><use href="#bloomBig" transform="translate(1450 590) scale(1.25)"/></g></g>
  <g class="sway" style="animation-delay:14s"><g class="bloom" style="animation-delay:10.5s"><use href="#bloomBig" transform="translate(520 780) scale(1.0)"/></g></g>
  <g class="sway" style="animation-delay:14.5s"><g class="bloom" style="animation-delay:11.2s"><use href="#bloomBig" transform="translate(1060 830) scale(1.05)"/></g></g>
  <g class="sway" style="animation-delay:15s"><g class="bloom" style="animation-delay:11.9s"><use href="#bloomBig" transform="translate(620 210) scale(.7)"/></g></g>
  <g class="sway" style="animation-delay:15.5s"><g class="bloom" style="animation-delay:12.6s"><use href="#bloomBig" transform="translate(980 175) scale(.65)"/></g></g>
  <g class="sway" style="animation-delay:16s"><g class="bloom" style="animation-delay:13.3s"><use href="#bloomBig" transform="translate(260 500) scale(.6)"/></g></g>
  <g class="sway" style="animation-delay:16.5s"><g class="bloom" style="animation-delay:14s"><use href="#bloomBig" transform="translate(1340 480) scale(.7)"/></g></g>
  <g class="fade" style="animation-delay:5s">
    <use href="#bud" transform="translate(330 130) scale(1.1)"/>
    <use href="#bud" transform="translate(1400 210) scale(.9)"/>
    <use href="#bud" transform="translate(110 610) scale(1.0)"/>
    <use href="#bud" transform="translate(760 140) scale(.8)"/>
    <use href="#bud" transform="translate(1540 620) scale(.9)"/>
    <use href="#bud" transform="translate(420 860) scale(1.0)"/>
  </g>
  <g>
    <g><animateTransform attributeName="transform" type="translate" from="520 -80" to="520 1000" dur="10s" begin="2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="330" dur="7s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="780 -80" to="780 1020" dur="12s" begin="4s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-300" dur="8s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="950 -80" to="950 990" dur="11s" begin="1s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="360 -80" to="360 980" dur="13s" begin="3s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-340" dur="7.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1180 -80" to="1180 1000" dur="10.5s" begin="5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="320" dur="6.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="640 -80" to="640 980" dur="12.5s" begin="6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-320" dur="8.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1030 -80" to="1030 960" dur="11.5s" begin="2.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="340" dur="7s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1380 -80" to="1380 980" dur="13.5s" begin="4.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-310" dur="8s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
  </g>
</svg>
