<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4f6"/>
      <stop offset="1" stop-color="#f6e0e6"/>
    </linearGradient>
    <filter id="blurA"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="blurB"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="blurC"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="petal"><path d="M0 0 C -9 -12 -11 -22 -4 -30 C -1.5 -33.5 1.5 -33.5 4 -30 C 11 -22 9 -12 0 0 Z" fill="#f8cfd8" opacity="0.95"/></g>
    <g id="blossom">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="3.2" fill="#d95c6e"/>
      <circle cx="-4" cy="-2" r="1.3" fill="#eaa6b0"/>
      <circle cx="4" cy="-2" r="1.3" fill="#eaa6b0"/>
      <circle cx="0" cy="4" r="1.3" fill="#eaa6b0"/>
    </g>
    <g id="petal-s"><path d="M0 0 C -6 -8 -7 -14 -2.6 -19 C -1 -21 1 -21 2.6 -19 C 7 -14 6 -8 0 0 Z" fill="#f3b8c6"/></g>
    <style>
      @keyframes inkSpread { 0% {opacity:0; transform:scale(.35)} 40% {opacity:.8} 100% {opacity:.72; transform:scale(1.18)} }
      .inkA{ animation: inkSpread 10s ease-out both; transform-box:fill-box; transform-origin:center; }
      .inkB{ animation: inkSpread 14s ease-out both; transform-box:fill-box; transform-origin:center; }
      @keyframes bloom { 0% {opacity:0; transform:scale(.15) rotate(-10deg)} 55% {opacity:1; transform:scale(1.08) rotate(3deg)} 100% {opacity:1; transform:scale(1) rotate(0deg)} }
      .bloom{ animation: bloom 3.6s ease-out both; transform-box:fill-box; transform-origin:center; }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      .fade{ animation: fadeIn 5s ease-out both; }
      @keyframes sway { 0%,100% {transform:rotate(-2deg)} 50% {transform:rotate(2deg)} }
      .sway{ animation: sway 7s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1250" cy="320" rx="380" ry="240" fill="#f5ccd6" opacity="0.5" filter="url(#blurB)"/>
  <ellipse cx="330" cy="660" rx="400" ry="230" fill="#f2c2cd" opacity="0.42" filter="url(#blurB)"/>
  <ellipse cx="820" cy="200" rx="300" ry="180" fill="#f8dbe2" opacity="0.5" filter="url(#blurB)"/>
  <g filter="url(#blurA)" class="fade">
    <path d="M0 620 Q 260 500 560 560 T 1180 540 T 1600 610 L 1600 900 L 0 900 Z" fill="#8a6a73" opacity="0.4"/>
  </g>
  <g filter="url(#blurA)" class="fade">
    <path d="M0 720 Q 300 610 620 670 T 1220 650 T 1600 700 L 1600 900 L 0 900 Z" fill="#5d4750" opacity="0.42"/>
  </g>
  <ellipse class="inkA" cx="300" cy="300" rx="120" ry="90" fill="#a98a92" opacity="0" filter="url(#blurB)"/>
  <ellipse class="inkB" cx="1350" cy="520" rx="150" ry="100" fill="#b18f98" opacity="0" filter="url(#blurB)" style="animation-delay:1.2s"/>
  <ellipse class="inkA" cx="760" cy="470" rx="110" ry="80" fill="#9a7b84" opacity="0" filter="url(#blurB)" style="animation-delay:2s"/>
  <ellipse class="inkB" cx="520" cy="800" rx="160" ry="90" fill="#7e5f68" opacity="0" filter="url(#blurB)" style="animation-delay:2.8s"/>
  <ellipse class="inkA" cx="1150" cy="820" rx="140" ry="85" fill="#8f6f78" opacity="0" filter="url(#blurB)" style="animation-delay:3.5s"/>
  <ellipse class="inkB" cx="180" cy="560" rx="110" ry="75" fill="#a2858d" opacity="0" filter="url(#blurB)" style="animation-delay:4.2s"/>
  <ellipse class="inkA" cx="980" cy="160" rx="100" ry="70" fill="#b99ba3" opacity="0" filter="url(#blurC)" style="animation-delay:4.8s"/>
  <ellipse class="inkB" cx="1460" cy="180" rx="90" ry="65" fill="#b08f97" opacity="0" filter="url(#blurC)" style="animation-delay:5.4s"/>
  <g class="fade" opacity="0">
    <path d="M1660 -40 C 1480 30 1350 130 1230 250 C 1160 322 1100 402 1050 470" fill="none" stroke="#46343c" stroke-width="15" stroke-linecap="round"/>
    <path d="M1230 250 C 1180 240 1120 250 1060 275" fill="none" stroke="#46343c" stroke-width="9" stroke-linecap="round"/>
    <path d="M1140 340 C 1080 352 1020 382 970 422" fill="none" stroke="#46343c" stroke-width="8" stroke-linecap="round"/>
    <path d="M1050 470 C 1010 482 970 507 940 542" fill="none" stroke="#46343c" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g class="bloom" style="animation-delay:.5s"><use href="#blossom" transform="translate(1050 470) scale(1.35)"/></g>
  <g class="bloom" style="animation-delay:1.1s"><use href="#blossom" transform="translate(970 422) scale(1.1)"/></g>
  <g class="bloom" style="animation-delay:1.6s"><use href="#blossom" transform="translate(1060 275) scale(1.15)"/></g>
  <g class="bloom" style="animation-delay:2.2s"><use href="#blossom" transform="translate(1140 340) scale(.95)"/></g>
  <g class="bloom" style="animation-delay:2.7s"><use href="#blossom" transform="translate(1230 250) scale(1.05)"/></g>
  <g class="bloom" style="animation-delay:3.2s"><use href="#blossom" transform="translate(940 542) scale(.85)"/></g>
  <g class="bloom" style="animation-delay:3.6s"><use href="#blossom" transform="translate(1340 130) scale(1.2)"/></g>
  <g class="bloom" style="animation-delay:4.1s"><use href="#blossom" transform="translate(1410 90) scale(.8)"/></g>
  <g class="bloom" style="animation-delay:4.6s"><use href="#blossom" transform="translate(1170 300) scale(.75)"/></g>
  <g class="bloom" style="animation-delay:5.1s"><use href="#blossom" transform="translate(1020 360) scale(.7)"/></g>
  <g class="fade" opacity="0" style="animation-delay:3s">
    <circle cx="1100" cy="302" r="6" fill="#d95c6e"/>
    <circle cx="1200" cy="232" r="5.5" fill="#d95c6e"/>
    <circle cx="1000" cy="502" r="5" fill="#d95c6e"/>
    <circle cx="980" cy="452" r="4.5" fill="#d95c6e"/>
  </g>
  <g class="sway">
    <g><animateTransform attributeName="transform" type="translate" from="520 -80" to="520 1000" dur="9s" begin="1s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="330" dur="6s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="780 -80" to="780 1020" dur="11s" begin="3s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-300" dur="7s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="640 -80" to="640 980" dur="10s" begin="5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="920 -80" to="920 990" dur="12s" begin="2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-340" dur="6.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="420 -80" to="420 970" dur="10.5s" begin="4s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="320" dur="7.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1180 -80" to="1180 1000" dur="9.5s" begin="1.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-310" dur="5.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1380 -80" to="1380 980" dur="11.5s" begin="4.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="350" dur="7s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="300 -80" to="300 960" dur="13s" begin="2.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-330" dur="8.5s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1030 -80" to="1030 980" dur="10s" begin="6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="310" dur="6s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1500 -80" to="1500 960" dur="12s" begin="0.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="230 -80" to="230 980" dur="11s" begin="7s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="340" dur="6.8s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1260 -80" to="1260 990" dur="13.5s" begin="3.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-320" dur="7.8s" repeatCount="indefinite"/><use href="#petal-s"/></g></g>
  </g>
</svg>
