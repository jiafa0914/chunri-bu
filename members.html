<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成员 · 椿日部</title>
<link rel="icon" href="assets/svg/seal.svg">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<div id="site-header-placeholder"></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>成员风采<span class="dot"></span></h2>
      <p class="section-sub">点击成员查看详情 · 进入后会播放他/她的专属旋律</p>
    </div>
    <div class="grid grid-4" id="member-list"></div>
    <p class="member-swiper-hint" id="swipe-hint" style="display:none">← 左右滑动查看每位成员 →</p>
    <p class="hint" style="text-align:center;margin-top:26px">想更新自己的照片、签名或背景音乐？<a href="login.html" style="color:var(--cinnabar)">登录</a>后进入<a href="my.html" style="color:var(--cinnabar)">我的档案</a>即可自助修改。</p>
  </div>
</section>

<div id="site-footer-placeholder"></div>
<script src="assets/js/vendor/cloudbase.full.js"></script>
<script src="assets/js/cloudbase.js"></script>
<script src="assets/js/github.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  function memberCard(m, big){
    var photo = m.photo ? '<img src="' + C.esc(m.photo) + '" alt="">' : '<div class="ph-placeholder">' + C.esc((m.name || '?').slice(0,1)) + '</div>';
    if(big){
      return '<article class="card member-card" data-id="' + C.esc(m.id) + '">' +
        '<div class="member-photo">' + photo + '</div>' +
        '<div class="member-name">' + C.esc(m.name) + '</div>' +
        '<div class="member-role"><span class="badge">' + C.esc(m.role || '') + '</span>' + (m.title ? ' <span class="badge badge-gold">' + C.esc(m.title) + '</span>' : '') + '</div>' +
        '<div class="member-signature">「' + C.esc(m.signature || '') + '」</div>' +
        '<div class="member-bio">' + C.esc(m.bio || '') + '</div>' +
        (m.bgm ? '<button class="bgm-btn" data-bgm="' + C.esc(m.bgm) + '">♪ 听曲</button>' : '') +
        '</article>';
    }
    return '<article class="card member-card" data-id="' + C.esc(m.id) + '">' +
      '<div class="member-photo">' + photo + '</div>' +
      '<div class="member-name">' + C.esc(m.name) + '</div>' +
      '<div class="member-role"><span class="badge">' + C.esc(m.role || '') + '</span></div>' +
      '<div class="member-signature">「' + C.esc(m.signature || '') + '」</div>' +
      '<div class="member-bio">' + C.esc(m.bio || '') + '</div>' +
      (m.bgm ? '<button class="bgm-btn" data-bgm="' + C.esc(m.bgm) + '">♪ 听曲</button>' : '') +
      '</article>';
  }
  function openMember(m){
    C.openMember(m);
    var photo = m.photo ? '<img src="' + C.esc(m.photo) + '" alt="">' : '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:var(--font-title);font-size:44px;color:var(--ink-3)">' + C.esc((m.name || '?').slice(0,1)) + '</div>';
    C.modal.onClose = function(){ C.closeMember(); };
    C.modal.open(
      '<div class="modal-title">成员资料</div>' +
      '<div class="member-detail">' +
        '<div class="md-photo">' + photo + '</div>' +
        '<div>' +
          '<div class="md-name">' + C.esc(m.name) + '</div>' +
          '<div style="margin-top:8px"><span class="badge">' + C.esc(m.role || '') + '</span>' + (m.title ? ' <span class="badge badge-gold">' + C.esc(m.title) + '</span>' : '') + '</div>' +
          '<div class="md-sign">「' + C.esc(m.signature || '') + '」</div>' +
          '<div class="md-bio">' + C.esc(m.bio || '') + '</div>' +
          '<div style="margin-top:16px">' + (m.bgm ? '<button class="bgm-btn" data-bgm="' + C.esc(m.bgm) + '">♪ 听曲</button>' : '<span class="hint">这位游侠还没设置背景音乐</span>') + '</div>' +
        '</div>' +
      '</div>'
    );
    C.setupBgm();
  }
  (async function(){
    var box = document.getElementById('member-list');
    var isMobile = window.matchMedia('(max-width:768px)').matches;
    var list = [], usedCloud = false;
    try {
      await CB.ensureAnon();
      var docs = await CB.listProfiles();
      var actives = (docs || []).filter(function(p){ return p.active !== false; });
      if(actives.length){
        usedCloud = true;
        var need = [];
        actives.forEach(function(p){ if(p.photo) need.push(p.photo); if(p.bgm) need.push(p.bgm); });
        var urls = {};
        try { urls = await CB.fileUrls(need); } catch(e){ console.warn(e); }
        list = actives.map(function(p){
          return {
            id: p._id || p.id || p.uid,
            name: p.name || '未命名',
            role: p.role || '',
            title: p.title || '',
            signature: p.signature || '',
            bio: p.bio || '',
            photo: p.photo ? (urls[p.photo] || '') : '',
            bgm: p.bgm ? (urls[p.bgm] || '') : ''
          };
        });
      }
    } catch(e){ console.warn('云成员读取失败，使用旧数据：', e); }
    if(!usedCloud){
      var data = await C.fetchJSON('members.json');
      list = (data.members || []).filter(function(m){ return m.active !== false; });
    }
    if(isMobile){ box.className = 'member-swiper'; document.getElementById('swipe-hint').style.display = ''; } else { box.className = 'grid grid-4'; }
    box.innerHTML = list.map(function(m){ return memberCard(m, isMobile); }).join('') || '<p class="hint">暂无成员</p>';
    box.querySelectorAll('.member-card').forEach(function(card){
      card.addEventListener('click', function(){
        var m = list.find(function(x){ return x.id === card.dataset.id; });
        if(m) openMember(m);
      });
    });
    C.setupBgm();
  })().catch(function(e){ console.error(e); });
})();
</script>
</body>
</html>
