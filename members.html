<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成员 · 椿日部</title>
<link rel="icon" href="assets/svg/seal.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header-placeholder"></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>成员风采<span class="dot"></span></h2>
      <p class="section-sub">每一位游侠都有自己的照片、签名与专属旋律</p>
    </div>
    <div class="grid grid-4" id="member-list"></div>
    <p class="hint" style="text-align:center;margin-top:26px">想更新自己的照片、签名或背景音乐？请联系社主获取你的专属编辑链接。</p>
  </div>
</section>

<div id="site-footer-placeholder"></div>
<script src="assets/js/github.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async function(){
  var data = await C.fetchJSON('members.json');
  var list = (data.members || []).filter(function(m){ return m.active !== false; });
  var box = document.getElementById('member-list');
  box.innerHTML = list.map(function(m){
    var photo = m.photo ? '<img src="' + C.esc(m.photo) + '" alt="">' : '<div class="ph-placeholder">' + C.esc((m.name || '?').slice(0,1)) + '</div>';
    return '<article class="card member-card">' +
      '<div class="member-photo">' + photo + '</div>' +
      '<div class="member-name">' + C.esc(m.name) + '</div>' +
      '<div class="member-role"><span class="badge">' + C.esc(m.role || '') + '</span></div>' +
      '<div class="member-signature">「' + C.esc(m.signature || '') + '」</div>' +
      '<div class="member-bio">' + C.esc(m.bio || '') + '</div>' +
      (m.bgm ? '<button class="bgm-btn" data-bgm="' + C.esc(m.bgm) + '">♪ 听曲</button>' : '') +
      '</article>';
  }).join('') || '<p class="hint">暂无成员</p>';
  C.setupBgm();
})().catch(function(e){ console.error(e); });
</script>
</body>
</html>
