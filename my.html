<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的档案 · 椿日部</title>
<link rel="icon" href="assets/svg/seal.svg">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<div id="site-header-placeholder"></div>

<div class="container" style="max-width:560px;padding-top:36px;padding-bottom:60px">
  <div id="need-login" class="admin-card" style="display:none">
    <h3>请先登录</h3>
    <p class="hint" style="margin:10px 0">登录后才能设置自己的照片、签名和背景音乐。</p>
    <div class="form-actions"><a class="btn btn-cinnabar btn-sm" href="login.html">去登录 / 注册</a></div>
  </div>

    <div id="no-profile" class="admin-card" style="display:none">
    <h3>还没有成员档案</h3>
    <p class="hint" style="margin:10px 0" id="np-msg"></p>
    <p class="hint" style="margin:6px 0">你的登录邮箱：<b id="np-email"></b></p>
    <div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:14px">
      <p class="hint" style="margin-bottom:8px">如果社主已经给你建了档案，输入你的【游戏昵称 / 游戏ID】即可绑定，绑定后就能自己修改照片、签名和背景音乐：</p>
      <div style="display:flex;gap:8px">
        <input id="bind-key" placeholder="游戏昵称 / 游戏ID" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius)">
        <button class="btn btn-cinnabar btn-sm" id="bind-btn">绑定档案</button>
      </div>
    </div>
    <div class="form-actions"><a class="btn btn-paper btn-sm" href="members.html">看看成员页</a></div>
  </div>
<div id="profile-card" class="admin-card" style="display:none">
    <h3>我的档案 <span id="my-role" class="badge" style="vertical-align:middle"></span></h3>
    <p class="hint" style="margin-bottom:14px">这里的内容会展示在「成员」页；背景音乐会在别人点开你的详情时播放。</p>

    <div class="grid grid-2">
      <div class="field"><label>游戏昵称 *</label><input id="my-name" placeholder="江湖名号"></div>
      <div class="field"><label>游戏 ID</label><input id="my-gameid" placeholder="游戏内名字/编号"></div>
    </div>

    <div class="field">
      <label>照片</label>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <img id="my-photo-preview" src="assets/svg/plum.svg" alt="照片预览" style="width:88px;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#faf6ea">
        <div style="flex:1">
          <input id="my-photo-file" type="file" accept="image/*">
          <p class="hint" style="margin-top:6px">建议竖版照片，会自动压缩。</p>
        </div>
      </div>
    </div>

    <div class="field"><label>签名（座右铭）</label><input id="my-signature" placeholder="一蓑烟雨任平生"></div>
    <div class="field"><label>简介</label><textarea id="my-bio" style="min-height:80px" placeholder="一句话介绍自己"></textarea></div>

    <div class="field">
      <label>我的背景音乐（BGM）</label>
      <input id="my-bgm-file" type="file" accept="audio/*">
      <p class="hint" id="my-bgm-hint" style="margin-top:6px">未设置 · 可上传 mp3（8MB 内）</p>
    </div>

    <div class="form-actions">
      <button class="btn btn-cinnabar btn-sm" id="my-save">保存档案</button>
      <a class="btn btn-paper btn-sm" href="members.html">看看成员页</a>
    </div>
  </div>
</div>

<div id="site-footer-placeholder"></div>
<script src="assets/js/vendor/cloudbase.full.js"></script>
<script src="assets/js/cloudbase.js"></script>
<script src="assets/js/github.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  var C = window.C, CB = window.CB;
  function $(id){ return document.getElementById(id); }
  var docId = null, newPhoto = null, newBgm = null, role = '';

  function ts(){ return new Date().toISOString().replace(/[-:T]/g,'').slice(0,14) + Math.random().toString(36).slice(2,6); }
  async function bindProfile(){
    var key = $('bind-key').value.trim();
    if(!key){ C.toast('请输入游戏昵称或游戏ID', 'err'); return; }
    var uid = CB.getUid();
    var email = CB.getEmail() || '';
    if(!uid || !email){ C.toast('请先登录', 'err'); return; }
    var btn = $('bind-btn');
    btn.disabled = true; btn.textContent = '绑定中…';
    C.toast('正在查找档案…');
    try {
      var list = await CB.listProfiles();
      var k = key.toLowerCase();
      var matches = (list || []).filter(function(p){
        if(p.uid || p.email) return false;
        var n = String(p.name || '').toLowerCase();
        var g = String(p.gameId || '').toLowerCase();
        return n === k || g === k;
      });
      if(!matches.length){
        C.toast('没找到这个昵称/ID的档案，请确认后重试，或联系社主', 'err');
        return;
      }
      var target = matches[0];
      await CB.coll('profiles').doc(target._id || target.id).update({
        uid: uid, email: email, claimedAt: new Date().toISOString(), claimCode: ''
      });
      C.toast('绑定成功！现在可以编辑档案了', 'ok');
      setTimeout(function(){ location.reload(); }, 1200);
    } catch(e){
      C.toast('绑定失败：' + (e.message || e), 'err');
    } finally {
      btn.disabled = false; btn.textContent = '绑定档案';
    }
  }
  $('bind-btn').addEventListener('click', bindProfile);

  $('my-photo-file').addEventListener('change', function(){
    var f = $('my-photo-file').files[0];
    if(!f) return;
    if(!/^image\//.test(f.type)){ C.toast('请选择图片文件', 'err'); return; }
    newPhoto = f;
    $('my-photo-preview').src = URL.createObjectURL(f);
  });
  $('my-bgm-file').addEventListener('change', function(){
    var f = $('my-bgm-file').files[0];
    if(!f) return;
    if(!/^audio\//.test(f.type) && !/\.mp3$/i.test(f.name)){ C.toast('请选择音频文件（mp3 等）', 'err'); return; }
    if(f.size > 8*1024*1024){ C.toast('音频请控制在 8MB 以内', 'err'); $('my-bgm-file').value=''; return; }
    newBgm = f;
    $('my-bgm-hint').textContent = '已选择：' + f.name + '（保存后生效）';
  });

  $('my-save').addEventListener('click', async function(){
    var name = $('my-name').value.trim();
    if(!name){ C.toast('请填写游戏昵称', 'err'); return; }
    var btn = $('my-save');
    btn.disabled = true; btn.textContent = '保存中…';
    C.toast('正在保存…');
    try {
      var uid = CB.getUid();
      var data = {
        name: name,
        gameId: $('my-gameid').value.trim(),
        signature: $('my-signature').value.trim(),
        bio: $('my-bio').value.trim(),
        updatedAt: new Date().toISOString()
      };
      if(newPhoto){
        C.toast('正在上传照片…');
        var pr = await CB.upload('member/' + uid + '/photo-' + ts() + '.jpg', newPhoto);
        data.photo = pr.id || pr.path;
        newPhoto = null;
      }
      if(newBgm){
        C.toast('正在上传背景音乐…');
        var br = await CB.upload('member/' + uid + '/bgm-' + ts() + '.mp3', newBgm);
        data.bgm = br.id || br.path;
        newBgm = null;
      }
      docId = await CB.upsertDoc('profiles', docId, data);
      C.toast('档案已保存', 'ok');
    } catch(e){
      C.toast('保存失败：' + (e.message || e), 'err');
    } finally {
      btn.disabled = false; btn.textContent = '保存档案';
    }
  });

    (async function(){
    C.injectShell();
    var claim = (new URLSearchParams(location.search)).get('claim') || '';
    if(claim) sessionStorage.setItem('claim_code', claim);
    if(!claim) claim = sessionStorage.getItem('claim_code') || '';

    var ls = await CB.getLoginState();
    var email = CB.getEmail() || '';
    if(!ls || !ls.user || !email){
      $('need-login').style.display = '';
      return;
    }

    function fillForm(m){
      $('my-name').value = m.name || '';
      $('my-gameid').value = m.gameId || '';
      $('my-signature').value = m.signature || '';
      $('my-bio').value = m.bio || '';
      if(m.photo){ CB.fileUrl(m.photo).then(function(u){ if(u) $('my-photo-preview').src = u; }); }
      if(m.bgm){ $('my-bgm-hint').textContent = '已设置背景音乐（可重新上传替换）'; }
    }
    function showNoProfile(html){
      $('profile-card').style.display = 'none';
      $('need-login').style.display = 'none';
      $('no-profile').style.display = '';
      $('np-msg').innerHTML = html;
      $('np-email').textContent = email;
    }

    var uid = CB.getUid();
    var list = [];
    try { list = await CB.listProfiles(); } catch(e){ console.warn(e); }
    var mine = list.filter(function(p){ return p.uid === uid; })[0];

    if(!mine && claim){
      var target = null;
      try {
        var q = await CB.coll('profiles').where({ claimCode: claim }).limit(1).get();
        target = (q && q.data && q.data[0]) || null;
      } catch(e){ console.warn(e); }
      if(!target){
        for(var i = 0; i < list.length; i++){
          if(list[i].claimCode && list[i].claimCode === claim){ target = list[i]; break; }
        }
      }
      if(!target){
        sessionStorage.removeItem('claim_code');
        showNoProfile('认领链接无效或已被使用。请联系社主重新获取认领链接。');
        return;
      }
      if(target.uid && target.email && target.uid !== uid){
        sessionStorage.removeItem('claim_code');
        showNoProfile('这个档案已经被其他账号认领了。如果你确实是自己，请联系社主重新生成链接。');
        return;
      }
      var tid = target._id || target.id;
      try {
        await CB.coll('profiles').doc(tid).update({ uid: uid, email: email, claimedAt: new Date().toISOString(), claimCode: '' });
        C.toast('认领成功，以后可在「我的档案」自助修改', 'ok');
        sessionStorage.removeItem('claim_code');
        docId = tid;
        role = target.role || '成员';
        fillForm(Object.assign({}, target, { uid: uid, email: email }));
        $('my-role').textContent = role;
        $('profile-card').style.display = '';
      } catch(e){
        showNoProfile('认领失败：' + (e.message || e) + '。请把这段提示告诉社主。');
      }
      return;
    }

    if(!mine){
      sessionStorage.removeItem('claim_code');
      showNoProfile('你还没有成员档案，暂时不会出现在「成员」页。<br>请联系社主，让他在「管理面板 → 成员」里为你的档案点「认领链接」并把链接发给你；打开链接登录即可绑定并自助修改。');
      return;
    }

    sessionStorage.removeItem('claim_code');
    docId = mine._id || mine.id || '';
    role = mine.role || '成员';
    fillForm(mine);
    $('my-role').textContent = role;
    $('profile-card').style.display = '';
  })().catch(function(e){ console.warn(e); });
})();
</script>
</body>
</html>
