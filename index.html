<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>椿日部 · 燕云十六声百业社团</title>
<link rel="icon" href="assets/svg/seal.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header-placeholder"></div>

<section class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-veil"></div>
  <div class="hero-content">
    <img class="hero-seal" id="hero-seal-img" src="assets/svg/seal.svg" alt="椿日部印章">
    <h1 class="hero-title" id="hero-title">椿日部</h1>
    <p class="hero-sub" id="hero-sub">燕云十六声 · 天涯阁 · 六级百业</p>
    <p class="hero-slogan" id="hero-slogan">不问归期，只问江湖</p>
    <div class="hero-actions">
      <a class="btn btn-cinnabar" href="recruit.html">加入我们</a>
      <a class="btn btn-ink" href="#ann">最新公告</a>
    </div>
  </div>
  <div class="hero-scroll">▼</div>
</section>

<section class="section" id="ann">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>最新公告<span class="dot"></span></h2>
      <p class="section-sub">椿日部的一言一行</p>
    </div>
    <div id="ann-list"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head"><h2 class="section-title"><span class="dot"></span>关于椿日部<span class="dot"></span></h2></div>
    <div class="grid grid-3" id="about-list"></div>
  </div>
</section>

<section class="section" style="background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>近期活动<span class="dot"></span></h2>
      <p class="section-sub"><a href="activities.html" style="color:var(--cinnabar)">查看全部活动 →</a></p>
    </div>
    <div id="act-list"></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>成员风采<span class="dot"></span></h2>
      <p class="section-sub"><a href="members.html" style="color:var(--cinnabar)">全部成员 →</a></p>
    </div>
    <div class="grid grid-4" id="mem-list"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title"><span class="dot"></span>江湖日报<span class="dot"></span></h2>
      <p class="section-sub"><a href="daily.html" style="color:var(--cinnabar)">往期日报 →</a></p>
    </div>
    <div id="daily-list"></div>
  </div>
</section>

<div class="cta-band">
  <h2>江湖路远，椿日可期</h2>
  <p>无论你是初入燕云的新游侠，还是行走多年的老江湖，椿日部都愿与你同行。</p>
  <a class="btn btn-cinnabar" href="recruit.html">加入椿日部</a>
</div>

<div id="site-footer-placeholder"></div>
<script src="assets/js/vendor/cloudbase.full.js"></script>
<script src="assets/js/cloudbase.js"></script>
<script src="assets/js/github.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  function memberCard(m){
    var photo = m.photo ? '<img src="' + C.esc(m.photo) + '" alt="">' : '<div class="ph-placeholder">' + C.esc((m.name || '?').slice(0,1)) + '</div>';
    return '<article class="card member-card">' +
      '<div class="member-photo">' + photo + '</div>' +
      '<div class="member-name">' + C.esc(m.name) + '</div>' +
      '<div class="member-role"><span class="badge">' + C.esc(m.role || '') + '</span></div>' +
      '<div class="member-signature">「' + C.esc(m.signature || '') + '」</div>' +
      '<div class="member-bio">' + C.esc(m.bio || '') + '</div>' +
      (m.bgm ? '<button class="bgm-btn" data-bgm="' + C.esc(m.bgm) + '">♪ 听曲</button>' : '') +
      '</article>';
  }
  function actCard(a){
    return '<div class="card" style="margin-bottom:14px">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">' +
      '<span class="badge">' + C.esc(a.type || '') + '</span>' +
      '<span class="badge badge-dai">' + C.esc(a.status || '') + '</span></div>' +
      '<h3 class="card-title" style="margin-top:8px">' + C.esc(a.title) + '</h3>' +
      '<p class="card-text">' + C.esc(a.date || '') + (a.time ? ' ' + C.esc(a.time) : '') + ' · ' + C.esc(a.location || '') + '</p>' +
      '<p class="card-text" style="margin-top:6px">' + C.esc(a.desc || '') + '</p>' +
      '<p style="margin-top:10px"><a class="btn btn-paper btn-sm" href="activities.html">报名/详情</a></p></div>';
  }
  (async function(){
    var cfg = await C.fetchJSON('config.json');
    var st = cfg.site;
    document.title = st.name + ' · ' + st.subtitle;
    document.getElementById('hero-bg').style.backgroundImage = 'url("' + C.esc(st.background) + '")';
    document.getElementById('hero-title').textContent = st.name;
    document.getElementById('hero-sub').textContent = st.subtitle;
    document.getElementById('hero-slogan').textContent = st.slogan || '';
    document.querySelector('.brand-name small').textContent = st.subtitle || '';

    var ann = cfg.announcements || [];
    var annBox = document.getElementById('ann-list');
    if(ann.length){
      annBox.innerHTML = ann.slice(0, 3).map(function(a){
        return '<div class="list-item"><div class="list-item-head"><div><div class="list-item-title">' + C.esc(a.title) + '</div><div class="list-item-meta">' + C.esc(a.date) + '</div></div></div>' +
          '<div class="list-item-body open"><p>' + C.esc(a.content) + '</p></div></div>';
      }).join('');
    } else annBox.innerHTML = '<p class="hint">暂无公告</p>';

    var about = cfg.about || [];
    var abBox = document.getElementById('about-list');
    if(about.length){
      abBox.innerHTML = about.map(function(a){
        return '<div class="card"><h3 class="card-title">' + C.esc(a.title) + '</h3><p class="card-text">' + C.esc(a.content) + '</p></div>';
      }).join('');
    }

    var acts = await C.fetchJSON('activities.json');
    document.getElementById('act-list').innerHTML = (acts.activities || []).slice(0, 3).map(actCard).join('') || '<p class="hint">暂无活动</p>';

    var memList = document.getElementById('mem-list');
    var mems4 = [];
    try {
      await CB.ensureAnon();
      var docs = await CB.listProfiles();
      var need = [];
      docs.forEach(function(p){ if(p.active !== false){ if(p.photo) need.push(p.photo); if(p.bgm) need.push(p.bgm); } });
      var urls = {};
      try { urls = await CB.fileUrls(need); } catch(e){ console.warn(e); }
      mems4 = docs.filter(function(p){ return p.active !== false; }).slice(0, 4).map(function(p){
        return { name: p.name, role: p.role, signature: p.signature, bio: p.bio, photo: p.photo ? (urls[p.photo] || '') : '', bgm: p.bgm ? (urls[p.bgm] || '') : '' };
      });
    } catch(e){ console.warn('云端成员读取失败，使用旧数据', e); }
    if(!mems4.length){
      var oldMems = await C.fetchJSON('members.json');
      mems4 = (oldMems.members || []).filter(function(m){ return m.active !== false; }).slice(0, 4);
    }
    memList.innerHTML = mems4.map(memberCard).join('') || '<p class="hint">暂无成员</p>';

    var dl = await C.fetchJSON('daily.json');
    var issues = dl.issues || [];
    document.getElementById('daily-list').innerHTML = issues.slice(0, 1).map(function(d){
      return '<div class="list-item"><div class="list-item-head"><div><div class="list-item-title">' + C.esc(d.issue || '') + ' · ' + C.esc(d.title) + '</div><div class="list-item-meta">' + C.esc(d.date || '') + '</div></div></div>' +
        '<div class="list-item-body open">' + (d.content || []).map(function(p){ return '<p>' + C.esc(p) + '</p>'; }).join('') + '</div></div>';
    }).join('') || '<p class="hint">暂无日报</p>';

    C.setupBgm();
  })().catch(function(e){ console.error(e); });
})();
</script>
</body>
</html>
